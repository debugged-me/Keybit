<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save to KeyBit</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="../ui/tiles.css"><link rel="stylesheet" href="save.css"><script src="save.js" type="module"></script></head>
<body>
  <header><img src="../../icons/keybit.svg" alt="" width="18" height="18"><strong>KeyBit</strong><span id="site" class="site"></span><button id="close" class="icon-button" aria-label="Dismiss save prompt" type="button">×</button></header>
  <main>
    <h1 id="heading">Save this password?</h1>
    <div class="credential"><span id="tile" class="tile tone-6" aria-hidden="true">•</span><span class="details"><span id="username" class="primary"></span><span class="masked secondary" aria-label="Password hidden">••••••••••••</span></span></div>
    <p id="explain" class="explain" hidden></p>
    <fieldset id="choices" hidden><legend>Update which login?</legend><div id="choice-list"></div></fieldset>
    <p id="status" role="status" hidden></p>
  </main>
  <footer><button id="dismiss" type="button">Not now</button><span class="spacer"></span><button id="alternate" type="button" hidden></button><button id="save" type="button" disabled>Save password</button></footer>
</body>
</html>
