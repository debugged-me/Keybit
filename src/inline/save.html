<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save to KeyBit</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="save.css"><script src="save.js" type="module"></script></head>
<body>
  <header><img src="../../icons/keybit.svg" alt="" width="18" height="18"><strong>KeyBit</strong><button id="close" class="icon-button" aria-label="Dismiss save prompt" type="button">×</button></header>
  <main><h1 id="heading">Save this password?</h1><p id="site"></p><div class="credential"><span class="avatar" id="avatar" aria-hidden="true">•</span><span class="details"><span id="username" class="primary"></span><span class="masked secondary" aria-label="Password hidden">••••••••••••</span></span></div><p id="status" role="status" hidden></p></main>
  <footer><button id="dismiss" type="button">Not now</button><button id="save" type="button" disabled>Save password</button></footer>
</body>
</html>
