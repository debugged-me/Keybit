<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="../ui/theme.js"></script><title>KeyBit passkey</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="../ui/tiles.css"><link rel="stylesheet" href="save.css"><script src="passkey.js" type="module"></script></head>
<body>
  <header><img src="../../icons/keybit.svg" alt="" width="18" height="18"><strong>KeyBit</strong><span id="site" class="site"></span><button id="close" class="icon-button" aria-label="Dismiss passkey prompt" type="button">×</button></header>
  <main>
    <h1 id="heading">Passkey</h1>
    <div class="credential"><span id="tile" class="tile tone-6" aria-hidden="true">•</span><span class="details"><span id="username" class="primary"></span><span id="caption" class="secondary"></span></span></div>
    <fieldset id="choices" hidden><legend>Which passkey?</legend><div id="choice-list"></div></fieldset>
    <p id="explain" class="explain"></p>
    <p id="status" role="status" hidden></p>
  </main>
  <footer><button id="dismiss" type="button">Not now</button><span class="spacer"></span><button id="alternate" type="button">Use device passkey</button><button id="save" type="button" disabled>Save passkey</button></footer>
</body>
</html>
