<!doctype html>
<html lang="en" data-mode="modal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyBit Peek</title>
  <script src="../ui/theme.js"></script>
  <link rel="stylesheet" href="peek.css">
</head>
<body>
  <div id="backdrop" hidden></div>
  <main id="peek-window" role="dialog" aria-modal="true" aria-label="Link preview" hidden>
    <div id="site-pill">
      <span class="history-slot" id="back-slot"><button id="back" class="pill-button" type="button" aria-label="Back in preview" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button></span>
      <span class="history-slot" id="forward-slot"><button id="forward" class="pill-button" type="button" aria-label="Forward in preview" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></span>
      <button id="site" type="button" aria-label="Copy preview link">
        <span id="site-avatar" aria-hidden="true"><span id="site-letter">K</span><img id="site-icon" alt="" hidden></span>
        <span id="site-host"></span><span id="site-title"></span>
      </button>
      <span id="slow-loading" hidden>Still loading… <button id="slow-open" type="button">Open in tab</button></span>
    </div>
    <div id="controls" role="toolbar" aria-label="Preview controls">
      <button id="close" class="control" type="button" aria-label="Close preview (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <button id="expand" class="control" type="button" aria-label="Open in new tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5 9 15M10 5H5v14h14v-5"/></svg></button>
      <button id="split" class="control" type="button" aria-label="Use side view" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M14 5v14"/></svg></button>
    </div>
    <div id="card" tabindex="-1" aria-label="Preview page">
      <div id="progress" aria-hidden="true"><span></span></div>
      <div id="state-layer" hidden>
        <svg class="state-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18m-12 4 6 4m0-4-6 4"/></svg>
        <h1>This site doesn't allow previews</h1>
        <p>You can let KeyBit show it here, or open the page in a new tab.</p>
        <div class="state-actions"><button id="unblock" class="primary" type="button">Show it anyway</button><button id="blocked-open" type="button">Open in tab</button></div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="tooltip" role="tooltip" hidden></div>
    <span id="preview-status" class="sr-only" role="status" aria-live="polite"></span>
  </main>
  <script src="peek-utils.js"></script>
  <script src="peek-app.js"></script>
</body>
</html>
