<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../ui/theme.js"></script><title>KeyBit — Login form inspector</title><link rel="icon" type="image/svg+xml" href="../../icons/keybit.svg">
  <link rel="stylesheet" href="../ui/base.css"><link rel="stylesheet" href="../ui/tiles.css"><link rel="stylesheet" href="inspector.css">
  <script src="inspector.js" type="module"></script>
</head>
<body class="app">
  <main class="inspector">
    <header class="page-head">
      <img class="brand-icon" src="../../icons/keybit.svg" alt="">
      <div class="page-head-text">
        <h1>Login form inspector</h1>
        <p class="page-sub">The fields KeyBit can see and fill on the inspected page.</p>
      </div>
      <button id="inspect-again" class="secondary-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        Inspect again
      </button>
    </header>
    <section class="site-card" aria-labelledby="page-name">
      <span id="site-tile" class="tile tone-6" aria-hidden="true">?</span>
      <div class="site-text">
        <p id="page-name" class="site-name">Inspecting…</p>
        <p id="page-url" class="muted"></p>
      </div>
    </section>
    <div id="frames"></div>
    <div id="empty" class="empty-state" hidden>
      <p class="empty-title">No frames could be inspected</p>
      <p class="empty-hint">Open a regular HTTP or HTTPS page and try again.</p>
    </div>
  </main>
  <p id="message" class="message" role="status" popover="manual" hidden></p>
</body>
</html>
