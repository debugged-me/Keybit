<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../ui/theme.js"></script><title>KeyBit</title>
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="../ui/tiles.css">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body class="popup">
  <header class="header">
    <div class="brand"><img class="brand-icon" src="../../icons/keybit.svg" alt=""><h1>KeyBit</h1></div>
    <div class="header-actions">
      <span id="vault-state" class="status-pill">Locked</span>
      <button id="toggle-generator" class="icon-button" type="button" title="Generate a password" aria-label="Generate a password" aria-expanded="false" aria-controls="generator"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3M16 7l3 3M14 9l2 2"/></svg></button>
      <button id="lock" class="icon-button" type="button" title="Lock now" aria-label="Lock now" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </header>
  <main>
    <section id="generator" class="generator-drawer" aria-label="Password generator" hidden>
      <p id="generated" class="generated"></p>
      <div class="generator-actions">
        <button id="copy-generated" class="primary-button" type="button">Copy</button>
        <button id="regenerate" class="secondary-button" type="button">Another</button>
        <button id="symbols" class="chip" type="button" aria-pressed="true">Symbols</button>
        <button id="words" class="chip" type="button" aria-pressed="false">Words</button>
        <span id="generated-length" class="muted length">20 characters</span>
      </div>
    </section>
    <section class="site-card" aria-labelledby="site-name">
      <div class="site-row">
        <span id="site-tile" class="tile tone-6" aria-hidden="true">?</span>
        <div class="site-text"><p id="site-name" class="site-name">Current tab</p><p id="detection-status" class="muted" role="status">Checking page…</p></div>
        <button id="check-page" class="icon-button" type="button" aria-label="Check this page again" title="Check again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
    </section>
    <section id="auth" class="locked-panel"></section>
    <section id="unlocked" hidden>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search all logins" aria-label="Search all logins" maxlength="200" autocomplete="off"></label>
      <div class="section-title"><h2 id="matches-title">This site</h2><button id="add-login" class="text-button" type="button">+ Add login</button></div>
      <div id="matches" class="rows"></div>
      <div id="others" hidden><div class="section-title"><h2>Other logins</h2></div><div id="results" class="rows"></div></div>
    </section>
  </main>
  <p id="message" class="message" role="status" hidden></p>
  <footer class="footer">
    <button id="manage" class="text-button" type="button">Open KeyBit ↗</button>
    <button id="settings" class="text-button" type="button">Backup</button>
  </footer>
</body>
</html>
