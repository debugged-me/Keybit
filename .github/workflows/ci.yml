name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      # Loading an unpacked extension over the DevTools pipe needs Chrome 126 or newer.
      - run: npm run test:browser
        env:
          KEYBIT_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          KEYBIT_BROWSER_ARGS: --no-sandbox
      - run: npm run test:a11y
        env:
          KEYBIT_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          KEYBIT_BROWSER_ARGS: --no-sandbox
