name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYBIT_BROWSER: /usr/bin/google-chrome
      KEYBIT_BROWSER_ARGS: --no-sandbox --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Build upload packages
        run: |
          npm run package
          npm run pack:firefox
          cd peek
          zip -qr peekbit-chromium.zip manifest.json icons src
          cd dist/firefox
          zip -qr ../../peekbit-firefox.xpi .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keybit-extension-packages
          if-no-files-found: error
          path: |
            keybit.zip
            dist/keybit.xpi
            peek/peekbit-chromium.zip
            peek/peekbit-firefox.xpi
