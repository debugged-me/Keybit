<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KeyBit local login fixture</title><link rel="stylesheet" href="fixture.css"></head><body><main><h1>Local login test</h1><p>Use dummy credentials only.</p><login-shell></login-shell></main>
<script>
customElements.define("login-fields", class extends HTMLElement {
  connectedCallback() {
    this.attachShadow({ mode: "open" }).innerHTML =
      `<style>:host{display:block}.row{display:grid;gap:8px;max-width:320px}</style>
       <div class="row"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password"><button id="go" type="button">Sign in</button></div>`;
  }
});
customElements.define("login-shell", class extends HTMLElement {
  connectedCallback() {
    this.attachShadow({ mode: "open" }).innerHTML =
      `<style>:host{display:block}#box{display:grid;gap:8px;max-width:320px}</style>
       <div id="box"><label for="user">Username</label><input id="user" autocomplete="username"><login-fields></login-fields></div>`;
  }
});
</script></body></html>
