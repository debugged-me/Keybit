<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KeyBit local login fixture</title><link rel="stylesheet" href="fixture.css"><script src="fixture.js" defer></script></head><body><main><h1>Local login test</h1><p>Use dummy credentials only.</p><iframe id="child" title="Cross-origin login frame" style="width:420px;height:260px;border:1px solid #ccc"></iframe></main>
<script>
// The suite passes the iframe URL as ?child= so one fixture can host any second origin.
const child = new URLSearchParams(location.search).get("child");
if (child && /^https?:\/\//.test(child)) document.querySelector("#child").src = child;
</script></body></html>
