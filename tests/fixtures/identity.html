<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>KeyBit local address fixture</title><link rel="stylesheet" href="fixture.css"><script src="fixture.js" defer></script></head><body><main><h1>Local address test</h1><form>
<label for="fname">First name</label><input id="fname" autocomplete="given-name">
<label for="lname">Last name</label><input id="lname" autocomplete="family-name">
<label for="email">Email</label><input id="email" type="email" autocomplete="email">
<label for="street">Street</label><input id="street" autocomplete="street-address">
<label for="city">City</label><input id="city" autocomplete="address-level2">
<label for="region">State</label><select id="region" autocomplete="address-level1"><option value="">Choose…</option><option value="CA">California</option><option value="NY">New York</option></select>
<label for="zip">ZIP</label><input id="zip" autocomplete="postal-code">
<label for="country">Country</label><select id="country" autocomplete="country-name"><option value="">Choose…</option><option>United States</option><option>United Kingdom</option></select>
<button>Continue</button></form></main></body></html>
